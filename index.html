<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="十四経の流注を、拡大できるオリジナルの全身図で確認する">
<meta name="theme-color" content="#FFF5EB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="経絡ずかん">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>経絡ずかん</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap">
<style>
/* Layout: one-screen phone app — meridian picker + view tabs on top, zoomable vector figure in the middle, point info + ordered chips at the bottom. Same orange look as the 経穴暗唱 apps. */
:root{
  --bg:#FFF5EB; --paper:#FFFFFF; --soft:#FFE8D4; --soft2:#FFF1E4; --line:#F4D6BD; --ink:#3A2418; --mute:#8F7363; --faint:#D9BFAE;
  --or:#F26A1B; --or-d:#D4520A; --or-l:#FF9F55; --yel:#FFC83D; --red:#E5402B;
  --skin:#FFEDE0; --skin-line:#C99C80; --hair:#EBD9CB; --organ:#FFD2BE; --stage:#FFFBF7;
  --f:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --gut-l:max(14px,env(safe-area-inset-left,0px)); --gut-r:max(14px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5;overflow-y:auto;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible{outline:3px solid var(--or);outline-offset:2px}
#app{min-height:100%;height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}

.top{flex:none;padding:10px var(--gut-r) 6px var(--gut-l);display:flex;flex-direction:column;gap:7px}
.ttl{display:flex;align-items:baseline;gap:10px}
.ttl h1{margin:0;font-size:22px;font-weight:900;letter-spacing:.04em}
.ttl h1 span{color:var(--or)}
.ttl p{margin:0;font-size:12px;font-weight:700;color:var(--mute)}
.mers{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:3px}
.mers::-webkit-scrollbar{display:none}
.mer{flex:none;border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:800;color:var(--mute);display:flex;align-items:center;gap:5px}
.mer i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.mer[aria-pressed="true"]{background:var(--or);border-color:var(--or);color:#fff;box-shadow:0 3px 0 var(--or-d)}

.viewer{position:relative;flex:1;min-height:340px;margin:0 var(--gut-r) 0 var(--gut-l);border-radius:24px;background:var(--stage);border:2px solid var(--line);overflow:hidden;touch-action:none;cursor:grab}
.viewer:active{cursor:grabbing}
#fig{position:absolute;inset:0;width:100%;height:100%;display:block;font-family:var(--f);transition:opacity .18s}
#fig.swap{opacity:0}
.views{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:flex;background:var(--soft);border-radius:999px;padding:3px;gap:2px;box-shadow:0 2px 0 var(--line)}
.views button{border:0;background:transparent;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:800;color:var(--mute);white-space:nowrap}
.views button[aria-pressed="true"]{background:var(--paper);color:var(--or-d);box-shadow:0 2px 0 var(--line)}
.zbtns{position:absolute;right:10px;top:52px;display:flex;flex-direction:column;gap:6px}
.zbtns button{width:42px;height:42px;border-radius:14px;border:2px solid var(--line);background:var(--paper);font-size:20px;font-weight:900;color:var(--ink);box-shadow:0 3px 0 var(--line);padding:0}
.zbtns button.txt{font-size:11px}
.tgls{position:absolute;left:10px;top:52px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.tg{display:flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 10px 3px 8px;font-size:12px;font-weight:800;color:var(--mute);box-shadow:0 2px 0 var(--line)}
.tg i{width:10px;height:10px;border-radius:50%;background:var(--faint)}
.tg[aria-pressed="true"]{color:var(--ink)}
.tg[aria-pressed="true"] i{background:var(--or)}
.hintbar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(58,36,24,.78);color:#fff;font-size:11.5px;font-weight:700;border-radius:999px;padding:4px 12px;white-space:nowrap;pointer-events:none;transition:opacity .4s}
.xnote{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:var(--or);color:#fff;font-size:12px;font-weight:800;border-radius:999px;padding:4px 12px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .3s}
.xnote.on{opacity:1}

.panel{flex:none;padding:10px var(--gut-r) max(12px,env(safe-area-inset-bottom,0px)) var(--gut-l);display:flex;flex-direction:column;gap:8px}
.info{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:8px 12px;box-shadow:0 4px 0 var(--line);min-height:78px}
.code{width:52px;height:52px;border-radius:50%;background:var(--or);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;line-height:1;box-shadow:0 3px 0 var(--or-d)}
.code small{font-size:10px;font-weight:800;opacity:.9}
.code b{font-size:20px}
.nm{min-width:0}
.nm .big{font-size:30px;font-weight:900;line-height:1.15;white-space:nowrap}
.nm .big rt{font-size:.36em;font-weight:800;color:var(--mute);letter-spacing:.12em}
.nm .sub{font-size:12px;font-weight:700;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm .sub em{font-style:normal;background:var(--soft2);color:var(--or-d);border-radius:6px;padding:0 5px;margin-right:4px}
.nav{display:flex;gap:6px}
.nav button{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--paper);font-weight:900;font-size:15px;padding:0;box-shadow:0 3px 0 var(--line)}
.nav button:disabled{opacity:.3}
.row{display:flex;gap:8px;align-items:center}
.btn-play{flex:none;border:0;border-radius:16px;background:var(--or);color:#fff;font-weight:900;font-size:14px;padding:10px 14px;box-shadow:0 4px 0 var(--or-d);white-space:nowrap}
.btn-play:active{transform:translateY(3px);box-shadow:0 1px 0 var(--or-d)}
.chips{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:4px 10px;font-size:14px;font-weight:900;display:flex;align-items:center;gap:5px}
.chip small{font-size:10.5px;font-weight:800;color:var(--mute);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--or);border-color:var(--or);color:#fff}
.chip[aria-pressed="true"] small{color:#fff}

/* ---- figure ---- */
#fig .body{fill:var(--skin);stroke:var(--skin-line);stroke-width:1.5px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
#fig .hairfill{fill:var(--hair)}
#fig .det{fill:none;stroke:var(--skin-line);stroke-width:1.1px;vector-effect:non-scaling-stroke;stroke-linecap:round;opacity:.75}
#fig .detf{fill:var(--skin);stroke:var(--skin-line);stroke-width:1.1px;vector-effect:non-scaling-stroke}
#fig .crease{fill:none;stroke:var(--skin-line);stroke-width:1px;vector-effect:non-scaling-stroke;stroke-dasharray:3 3;opacity:.7}
#fig .ghost{fill:none;stroke:var(--skin-line);stroke-width:1.2px;vector-effect:non-scaling-stroke;stroke-dasharray:5 4;opacity:.7}
#fig .note{fill:var(--mute);font-weight:800;font-size:var(--fsi,12px)}
#fig .organ{fill:var(--organ);stroke:#E7A487;stroke-width:1px;vector-effect:non-scaling-stroke;opacity:.75}
#fig .organ-dim{opacity:.35}
#fig .colon{fill:none;stroke:var(--organ);stroke-width:12;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
#fig .inpath{fill:none;stroke:var(--or);stroke-width:2.4px;vector-effect:non-scaling-stroke;stroke-dasharray:6 5;stroke-linecap:round}
#fig .inlbl,#fig .brlbl{fill:var(--or-d);font-weight:800;font-size:var(--fsi,12px);paint-order:stroke;stroke:var(--stage);stroke-width:4px;stroke-linejoin:round}
#fig .brlbl{fill:var(--mute)}
#fig .internal{display:none}
#fig.showin .internal{display:inline}
#fig .mpath{fill:none;stroke:var(--mc,var(--or));stroke-width:4px;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
#fig .mflow{fill:none;stroke:#fff;stroke-width:2.2px;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-dasharray:1 13;opacity:0}
#fig.flowon .mflow{opacity:.95;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-14}}
#fig .branch{fill:none;stroke:var(--or-l);stroke-width:2.4px;vector-effect:non-scaling-stroke;stroke-dasharray:5 5;stroke-linecap:round}
#fig .lbl{fill:var(--ink);font-weight:900;font-size:var(--fs,14px);paint-order:stroke;stroke:var(--stage);stroke-width:3.5px;stroke-linejoin:round}
#fig.nolabel .lbl{display:none}
#fig.nolabel .pt.sel .lbl{display:inline}
#fig .dot{fill:#fff;stroke:var(--red);stroke-width:2.2px;vector-effect:non-scaling-stroke}
#fig .halo{fill:var(--yel);opacity:0;transform-box:fill-box;transform-origin:center}
#fig .pt.sel .dot{fill:var(--red)}
#fig .pt.sel .halo{opacity:.55;animation:halo 1.2s ease-in-out infinite}
#fig .pt.sel .lbl{fill:var(--red)}
@keyframes halo{50%{transform:scale(1.5);opacity:.25}}
#fig .runner{fill:var(--yel);stroke:var(--or-d);stroke-width:2px;vector-effect:non-scaling-stroke}
#fig .xlbl{fill:#fff;font-weight:900;font-size:var(--fsi,12px)}
#fig .xbox{fill:var(--or)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="ttl"><h1>経絡<span>ずかん</span></h1><p>流注を目で追う</p></div>
    <div class="mers" id="mers" role="group" aria-label="経絡を選ぶ"></div>
  </header>
  <div class="viewer" id="viewer">
    <svg id="fig" class="flowon" viewBox="0 0 700 1300" preserveAspectRatio="xMidYMid meet" role="img" aria-label="経絡の流注図"></svg>
    <div class="views" id="views" role="group" aria-label="図の向き"></div>
    <div class="tgls" id="tgls">
      <button class="tg" data-t="label" aria-pressed="true"><i></i>名前</button>
      <button class="tg" data-t="flow" aria-pressed="true"><i></i>流れ</button>
      <button class="tg" data-t="in" aria-pressed="false" id="tgIn"><i></i>体内</button>
    </div>
    <div class="zbtns" id="zbtns">
      <button id="zin" aria-label="拡大">＋</button><button id="zout" aria-label="縮小">−</button><button id="zfit" class="txt" aria-label="経絡全体を表示">全体</button>
    </div>
    <div class="hintbar" id="hintbar">ピンチで拡大・ドラッグで移動・点をタップ</div>
    <div class="xnote" id="xnote"></div>
  </div>
  <section class="panel">
    <div class="info" id="info"></div>
    <div class="row"><button class="btn-play" id="play">▶ 流注を再生</button><div class="chips" id="chips" role="group" aria-label="経穴を選ぶ"></div></div>
  </section>
</div>

<script>
/* ======================================================================
   図はすべてオリジナルの作図（教科書の図はなぞっていない）。
   座標は 700×1300 の全身図の上の位置。経穴は骨度法と脊椎の高さから置いた。
   前＝解剖学的立位の前面（被験者の右半身が画面の左）
   後＝後面（被験者の右半身が画面の右）
   横＝左側面（顔が画面の右）。腕は点線で透かしている
   内側＝右下肢の内側面（つま先が画面の左）
   ====================================================================== */
const VIEWS={f:"前",b:"後",s:"横",m:"内側"};
const BOUNDS={f:[0,40,700,1260],b:[0,40,700,1260],s:[150,40,600,1260],m:[180,600,560,1260]};

// ---- 輪郭（右半身を点列で持ち、左右反転して全身にする） ----
const FRONT_R=[[306,214],[304,236],[300,252],[280,262],[246,272],[210,284],[194,298],[186,322],[183,380],[180,430],[178,470],[172,520],[166,590],[160,650],[154,664],[146,680],[139,704],[143,712],[151,704],[157,692],[161,702],[161,730],[166,750],[171,731],[173,706],[173,735],[178,758],[183,736],[184,706],[184,733],[189,752],[194,733],[195,704],[196,724],[200,740],[204,722],[206,698],[206,672],[206,650],[210,600],[216,540],[222,470],[226,420],[230,352],[236,340],[238,380],[242,430],[248,490],[250,520],[246,570],[238,610],[232,640],[234,700],[244,780],[256,850],[262,900],[262,940],[262,1000],[268,1060],[276,1112],[278,1126],[270,1145],[264,1168],[266,1180],[272,1185],[281,1187],[291,1190],[300,1192],[310,1192],[318,1186],[322,1170],[322,1150],[322,1124],[320,1100],[316,1040],[318,980],[324,930],[328,900],[332,850],[338,780],[344,700],[348,672]];
const MX=x=>700-x;
const FULL=[...FRONT_R,[350,676],...FRONT_R.slice().reverse().map(([x,y])=>[MX(x),y])];
const HEAD_F="M350,60 C385,60 408,92 408,138 C408,168 404,192 398,204 C388,218 370,226 350,226 C330,226 312,218 302,204 C296,192 292,168 292,138 C292,92 315,60 350,60Z";
const SIDE_TORSO=[[330,56],[366,62],[388,82],[395,104],[396,120],[393,130],[398,145],[410,165],[402,174],[403,186],[398,192],[402,198],[396,214],[390,224],[372,230],[370,246],[374,262],[388,300],[398,340],[400,372],[394,410],[388,440],[390,480],[394,520],[398,560],[394,600],[384,640],[376,662],[340,676],[300,674],[276,640],[270,600],[282,560],[298,520],[300,480],[292,430],[286,370],[286,320],[292,280],[300,262],[290,224],[284,206],[272,180],[266,150],[270,110],[290,74]];
const SIDE_LEG=[[378,648],[376,720],[372,800],[370,860],[370,888],[366,920],[360,980],[356,1050],[354,1100],[352,1118],[372,1135],[400,1150],[425,1160],[444,1166],[450,1174],[444,1182],[380,1184],[320,1184],[298,1180],[294,1160],[300,1140],[306,1110],[300,1060],[296,1000],[302,950],[318,912],[310,880],[302,820],[298,760],[290,700],[282,668],[300,650],[340,640]];

function closed(P){ // 閉じた Catmull-Rom 曲線
  const n=P.length,f=v=>v.toFixed(1);let d=`M${P[0][0]},${P[0][1]}`;
  for(let i=0;i<n;i++){const p0=P[(i-1+n)%n],p1=P[i],p2=P[(i+1)%n],p3=P[(i+2)%n];
    d+=` C${f(p1[0]+(p2[0]-p0[0])/6)},${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)},${f(p2[1]-(p3[1]-p1[1])/6)} ${p2[0]},${p2[1]}`;}
  return d+"Z";
}
function open(P){
  if(P.length<2)return"";const f=v=>v.toFixed(1);let d=`M${P[0][0]},${P[0][1]}`;
  for(let i=0;i<P.length-1;i++){const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||P[i+1];
    d+=` C${f(p1[0]+(p2[0]-p0[0])/6)},${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)},${f(p2[1]-(p3[1]-p1[1])/6)} ${p2[0]},${p2[1]}`;}
  return d;
}
const mir=d=>d.replace(/(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/g,(_,x,y)=>`${MX(+x)},${y}`);
const det=(d,cls="det")=>`<path class="${cls}" d="${d}"/>`;
const both=(arr,cls="det")=>arr.map(d=>det(d,cls)+det(mir(d),cls)).join("");

function figure(v){
  if(v==="f")return `
    <ellipse class="detf" cx="291" cy="150" rx="8" ry="20"/><ellipse class="detf" cx="409" cy="150" rx="8" ry="20"/>
    <path class="body" d="${closed(FULL)}"/>
    <path class="body" d="${HEAD_F}"/>
    <path class="hairfill" d="M298,108 C300,70 330,60 350,60 C372,60 402,72 403,108 C390,86 312,86 298,108Z"/>
    ${both(["M318,122 Q330,116 342,121","M348,262 C320,268 262,274 214,284","M236,342 C262,388 318,398 346,392","M350,432 C324,452 284,478 252,500","M246,612 C280,632 318,652 344,666","M180,470 Q200,476 222,470","M160,672 Q170,690 177,700","M281,1187 L282,1177","M291,1190 L291,1179","M300,1192 L300,1179","M310,1192 L309,1178"])}
    ${both(["M160,650 Q183,656 206,650","M296,918 C298,980 300,1040 300,1100"],"crease")}
    <ellipse class="det" cx="330" cy="136" rx="8" ry="3.2"/><ellipse class="det" cx="370" cy="136" rx="8" ry="3.2"/>
    ${det("M347,128 L343,165 Q346,172 350,172 Q354,172 357,165")}${det("M336,190 Q350,196 364,190")}${det("M347,175 L348,184 M353,175 L352,184")}
    ${det("M340,262 Q350,270 360,262")}${det("M346,236 Q350,242 354,236")}${det("M340,208 Q350,212 360,208")}
    <circle class="det" cx="288" cy="372" r="2.5"/><circle class="det" cx="412" cy="372" r="2.5"/>
    <ellipse class="det" cx="350" cy="560" rx="2.5" ry="4"/>
    <ellipse class="det" cx="294" cy="888" rx="13" ry="17"/><ellipse class="det" cx="406" cy="888" rx="13" ry="17"/>`;
  if(v==="b")return `
    <ellipse class="detf" cx="291" cy="150" rx="8" ry="20"/><ellipse class="detf" cx="409" cy="150" rx="8" ry="20"/>
    <path class="body" d="${closed(FULL)}"/>
    <path class="body hairfill" d="${HEAD_F}"/>
    ${det("M312,212 Q350,222 388,212")}
    ${det("M350,250 L350,612","crease")}<circle class="det" cx="350" cy="258" r="2.5"/>
    ${both(["M397,298 L397,372 Q404,384 418,376 L466,328 Q472,304 470,292","M397,306 L480,290","M354,514 C380,506 412,506 446,520","M352,672 C382,690 420,688 452,668","M378,905 Q405,912 434,905","M403,1060 L404,1116","M384,1182 Q405,1190 426,1182","M486,470 Q500,462 514,470"])}
    ${both(["M494,650 Q517,646 540,650"],"crease")}
    ${det("M350,600 L350,670")}`;
  if(v==="s")return `
    <path class="body" d="${closed(SIDE_TORSO)}"/>
    <path class="hairfill" d="M392,88 C380,66 350,54 330,56 C300,58 274,82 268,116 C266,140 268,170 280,200 C292,190 298,160 304,140 C312,122 330,116 352,112 C362,100 376,92 392,88Z"/>
    <path class="body" d="${closed(SIDE_LEG)}"/>
    ${det("M322,126 C334,126 336,150 333,166 C330,176 320,178 316,172 C312,160 312,136 322,126Z","detf")}${det("M322,136 C328,140 328,156 322,162")}
    ${det("M368,137 Q377,132 386,136 Q377,141 368,137")}${det("M364,121 Q378,115 392,119")}
    ${det("M400,168 Q404,172 402,174")}${det("M398,192 L388,191")}${det("M392,222 C372,222 346,214 334,204 C328,196 328,186 330,178")}
    <circle class="det" cx="398" cy="372" r="2.5"/>
    ${det("M372,868 C380,880 380,900 370,912")}<circle class="det" cx="334" cy="925" r="3"/>
    <ellipse class="det" cx="322" cy="1126" rx="7" ry="8"/>
    ${det("M420,1180 L421,1170 M432,1181 L433,1171")}
    <path class="ghost" d="M296,282 C288,330 292,420 296,470 C300,520 306,600 312,650 C320,668 340,668 346,650 C344,600 342,520 344,470 C348,420 354,330 350,282"/>
    <text class="note" x="300" y="700" text-anchor="end">腕（点線）</text>`;
  if(v==="m")return `
    <defs><linearGradient id="fadeTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFBF7" stop-opacity="1"/><stop offset="1" stop-color="#FFFBF7" stop-opacity="0"/></linearGradient></defs>
    <path class="body" d="${closed(SIDE_LEG.map(([x,y])=>[MX(x),y]))}"/>
    <rect x="250" y="600" width="220" height="80" fill="url(#fadeTop)"/>

    膻中:だんちゅう:f:350,372; 玉堂:ぎょくどう:f:350,345; 紫宮:しきゅう:f:350,320; 華蓋:かがい:f:350,297; 璇璣:せんき:f:350,277; 天突:てんとつ:f:350,262; 廉泉:れんせん:f:350,232; 承漿:しょうしょう:f:350,204`),

const EL={metal:"#7D8C9C",earth:"#D9940F",fire:"#E5402B",water:"#3D6FD6",wood:"#2E9E5E",gov:"#8A61CF",conc:"#D2559A"};

// ============ 描画 ============
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const svg=$("#fig"),viewer=$("#viewer");
let mer=MERS[0],view="f",sel=-1;
const viewsOf=m=>[...new Set(m.segs.map(s=>s.v))];
const segPts=s=>s.s.map(x=>Array.isArray(x)?x:mer.pts[x-1].p);
const PIVOT={f:350,b:384,s:300,m:360};

function draw(){

// 図の向きが変わるところに「→ 後へ続く」などの札を付ける
function crossMarks(v){
  let out="";
  mer.segs.forEach((s,k)=>{
    const nx=mer.segs[k+1];if(!nx||s.v!==v||nx.v===v)return;
    const last=s.s[s.s.length-1],p=Array.isArray(last)?last:mer.pts[last-1].p;
    out+=`<g class="xmark" data-go="${nx.v}" data-x="${p[0]}" data-y="${p[1]}"><rect class="xbox" rx="6"/><text class="xlbl" text-anchor="middle">→ ${VIEWS[nx.v]}へ続く</text></g>`;
  });
  return out;

// ============ ズーム・移動（viewBox を直接動かすので、どこまで拡大しても線がくっきり） ============
let vb={x:0,y:0,w:700,h:1300};
const MINW=34;
const aspect=()=>viewer.clientHeight/Math.max(1,viewer.clientWidth);
const upp=()=>vb.w/Math.max(1,viewer.clientWidth);
function clampVB(t){
  const a=aspect(),B=BOUNDS[view],bw=B[2]-B[0],bh=B[3]-B[1];
  t.w=Math.max(MINW,Math.min(t.w,Math.max(bw,bh/a)*1.08));t.h=t.w*a;
  const cx=Math.max(B[0],Math.min(B[2],t.x+t.w/2)),cy=Math.max(B[1],Math.min(B[3],t.y+t.h/2));
  t.x=cx-t.w/2;t.y=cy-t.h/2;return t;
}
function apply(){
  clampVB(vb);
  svg.setAttribute("viewBox",`${vb.x.toFixed(2)} ${vb.y.toFixed(2)} ${vb.w.toFixed(2)} ${vb.h.toFixed(2)}`);
  const u=upp();
  const fs=Math.max(2.6,Math.min(14*u,18)),fsi=Math.max(2.4,Math.min(11*u,15)),r=Math.max(1.1,Math.min(5*u,7));
  svg.style.setProperty("--fs",fs+"px");svg.style.setProperty("--fsi",fsi+"px");
  $$(".dot",svg).forEach(c=>c.setAttribute("r",r));
  $$(".halo",svg).forEach(c=>c.setAttribute("r",r*2.2));
  const off=r*1.7+fs*.15;
  $$(".lbl",svg).forEach(t=>{t.setAttribute("x",+t.dataset.x+off*(+t.dataset.s));t.setAttribute("y",+t.dataset.y+fs*.35);});
  $$(".xmark",svg).forEach(g=>{
    const x=+g.dataset.x,y=+g.dataset.y,w=fsi*7.4,h=fsi*1.7,bx=x+r*2,by=y-h-r*2;
    const rc=g.querySelector("rect"),tx=g.querySelector("text");
    rc.setAttribute("x",bx);rc.setAttribute("y",by);rc.setAttribute("width",w);rc.setAttribute("height",h);rc.setAttribute("rx",h/2);
    tx.setAttribute("x",bx+w/2);tx.setAttribute("y",by+h*.68);
  });
  const rn=$("#runner");if(rn)rn.setAttribute("r",r*1.5);
}
function fitRect([x0,y0,x1,y1],pad=0.08){
  const a=aspect(),cx=(x0+x1)/2,cy=(y0+y1)/2;
  const w0=Math.max(60,(x1-x0))*(1+pad*2),h0=Math.max(60,(y1-y0))*(1+pad*2);
  const w=Math.max(w0,h0/a);return {x:cx-w/2,y:cy-w*a/2,w,h:w*a};
}
function focusRect(){
  const ps=mer.pts.filter(p=>p.v===view).map(p=>p.p);
  if(!ps.length)return BOUNDS[view];
  const xs=ps.map(p=>p[0]),ys=ps.map(p=>p[1]);
  return [Math.min(...xs)-40,Math.min(...ys)-30,Math.max(...xs)+40,Math.max(...ys)+30];
}
let camRaf=0;
function animateTo(t,dur=420){
  cancelAnimationFrame(camRaf);clampVB(t);
  const s={...vb},t0=performance.now();
  const step=now=>{const k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3);
    vb={x:s.x+(t.x-s.x)*e,y:s.y+(t.y-s.y)*e,w:s.w+(t.w-s.w)*e,h:s.h+(t.h-s.h)*e};apply();
    if(k<1)camRaf=requestAnimationFrame(step);};
  camRaf=requestAnimationFrame(step);
}
function toUnits(cx,cy){const r=viewer.getBoundingClientRect(),u=upp();return [vb.x+(cx-r.left)*u,vb.y+(cy-r.top)*u];}
function zoomAt(cx,cy,f){
  const r=viewer.getBoundingClientRect(),[ux,uy]=toUnits(cx,cy);
  const w=Math.max(MINW,vb.w*f),u=w/viewer.clientWidth;
  vb={x:ux-(cx-r.left)*u,y:uy-(cy-r.top)*u,w,h:w*aspect()};apply();
}
const centerOn=(x,y,w)=>({x:x-w/2,y:y-w*aspect()/2,w,h:w*aspect()});

const ptrs=new Map();let lastTap=0,pinch=null;
$$("#zbtns,#tgls,#views").forEach(el=>el.addEventListener("pointerdown",e=>e.stopPropagation()));
viewer.addEventListener("pointerdown",e=>{
  cancelAnimationFrame(camRaf);stopPlay();hideHint();
  try{viewer.setPointerCapture(e.pointerId);}catch(_){}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY,t:performance.now()});
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2,my:(a.y+b.y)/2};}
});
viewer.addEventListener("pointermove",e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===1){const u=upp();vb.x-=dx*u;vb.y-=dy*u;apply();}
  else if(ptrs.size===2&&pinch){
    const [a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    const u=upp();vb.x-=(mx-pinch.mx)*u;vb.y-=(my-pinch.my)*u;
    zoomAt(mx,my,pinch.d/Math.max(1,d));pinch={d,mx,my};
  }
});
const endPtr=e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;
  const moved=Math.hypot(e.clientX-p.x0,e.clientY-p.y0),dt=performance.now()-p.t,single=ptrs.size===1&&!pinch;
  ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;
  if(single&&moved<8&&dt<450&&e.type==="pointerup")tap(e.clientX,e.clientY);
};
viewer.addEventListener("pointerup",endPtr);viewer.addEventListener("pointercancel",endPtr);
viewer.addEventListener("wheel",e=>{e.preventDefault();cancelAnimationFrame(camRaf);zoomAt(e.clientX,e.clientY,Math.exp(e.deltaY*0.0016));hideHint();},{passive:false});
function tap(cx,cy){
  const [ux,uy]=toUnits(cx,cy),lim=20*upp();
  for(const g of $$(".xmark",svg)){const b=g.getBBox();if(ux>=b.x-4&&ux<=b.x+b.width+4&&uy>=b.y-4&&uy<=b.y+b.height+4){goView(g.dataset.go,true);return;}}
  let best=-1,bd=1e9;
  mer.pts.forEach((p,i)=>{if(p.v!==view)return;const d=Math.hypot(p.p[0]-ux,p.p[1]-uy);if(d<bd){bd=d;best=i;}});
  if(best>=0&&bd<lim){select(best,{cam:false});lastTap=0;return;}
  const now=performance.now();
  if(now-lastTap<320){animateTo(centerOn(ux,uy,Math.max(MINW,vb.w/2.2)));lastTap=0;}else lastTap=now;
}
$("#zin").onclick=()=>animateTo(centerOn(vb.x+vb.w/2,vb.y+vb.h/2,vb.w/1.8),260);
$("#zout").onclick=()=>animateTo(centerOn(vb.x+vb.w/2,vb.y+vb.h/2,vb.w*1.8),260);
$("#zfit").onclick=()=>animateTo(fitRect(focusRect()));
setTimeout(hideHint,5000);
function hideHint(){const h=$("#hintbar");if(h)h.style.opacity="0";}
let xT=0;function xnote(t){const n=$("#xnote");n.textContent=t;n.classList.add("on");clearTimeout(xT);xT=setTimeout(()=>n.classList.remove("on"),2200);}

// ============ 向きの切り替え ============
function goView(v,fit){
  if(v===view){if(fit)animateTo(fitRect(focusRect()));return;}
  view=v;svg.classList.add("swap");renderViews();
  setTimeout(()=>{draw();if(fit)vb=fitRect(focusRect());apply();svg.classList.remove("swap");},120);
}
function renderViews(){
  const vs=viewsOf(mer);
  $("#views").innerHTML=vs.map(v=>`<button data-v="${v}" aria-pressed="${v===view}">${VIEWS[v]}</button>`).join("");
  $("#views").hidden=vs.length<2;
  $$("#views button").forEach(b=>b.onclick=()=>{stopPlay();goView(b.dataset.v,true);});
}

// ============ 選択・パネル ============
function renderMers(){
  $("#mers").innerHTML=MERS.map(m=>`<button class="mer" data-m="${m.id}" style="--c:${EL[m.c]}" aria-pressed="${m===mer}"><i></i>${m.short}</button>`).join("");
  $$(".mer").forEach(b=>b.onclick=()=>setMer(b.dataset.m));
}
function setMer(id){
  stopPlay();mer=MERS.find(m=>m.id===id);sel=-1;view=viewsOf(mer)[0];
  $$(".mer").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===id));
  const b=$(`.mer[data-m="${id}"]`);if(b)b.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});
  renderViews();draw();vb=fitRect(focusRect());apply();renderChips();renderInfo();
  try{history.replaceState(null,"","#"+id);}catch(_){}
}
function renderChips(){
  $("#chips").innerHTML=mer.pts.map((p,i)=>`<button class="chip" data-i="${i}" aria-pressed="${i===sel}"><small>${i+1}</small>${esc(p.n)}</button>`).join("");
  $$(".chip").forEach(b=>b.onclick=()=>{stopPlay();select(+b.dataset.i);});
  $("#chips").scrollLeft=0;
}
function renderInfo(){
  const m=mer,el=$("#info");
  if(sel<0){
    el.innerHTML=`<div class="code"><small>${m.id}</small><b>${m.pts.length}</b></div>
      <div class="nm"><div class="big" style="font-size:22px"><ruby>${esc(m.name)}<rt>${esc(m.yomi)}</rt></ruby></div><div class="sub">${m.pts.length}穴 · ${m.from} から ${m.to} へ${m.cross?` · ${esc(m.cross)}`:""}</div></div>
      <div class="nav"><button id="nx" aria-label="最初の経穴へ">▶</button></div>`;
    $("#nx").onclick=()=>select(0);return;
  }
  const p=m.pts[sel],pv=m.pts[sel-1],nx=m.pts[sel+1];
  el.innerHTML=`<div class="code"><small>${m.id}</small><b>${sel+1}</b></div>
    <div class="nm"><div class="big"><ruby>${esc(p.n)}<rt>${esc(p.y)}</rt></ruby></div>
      <div class="sub"><em>${VIEWS[p.v]}</em>${sel+1} / ${m.pts.length}　${pv?`${esc(pv.n)} ← `:""}<b>${esc(p.n)}</b>${nx?` → ${esc(nx.n)}`:""}</div></div>
    <div class="nav"><button id="pv" aria-label="前の経穴" ${pv?"":"disabled"}>◀</button><button id="nx" aria-label="次の経穴" ${nx?"":"disabled"}>▶</button></div>`;
  $("#pv").onclick=()=>{stopPlay();select(sel-1);};$("#nx").onclick=()=>{stopPlay();select(sel+1);};
}
function markSel(){
  $$(".pt",svg).forEach(g=>g.classList.toggle("sel",+g.dataset.i===sel));
  const g=$(`.pt[data-i="${sel}"]`,svg);if(g)g.parentNode.appendChild(g);
}
function zoomWidthFor(i){ // まわりの経穴が混んでいるほど大きく拡大する
  const p=mer.pts[i];let d=1e9;
  mer.pts.forEach((q,j)=>{if(j!==i&&q.v===p.v)d=Math.min(d,Math.hypot(q.p[0]-p.p[0],q.p[1]-p.p[1]));});
  return Math.max(70,Math.min(260,d*11));
}
function select(i,{cam=true}={}){
  sel=i;
  if(i>=0&&mer.pts[i].v!==view){
    view=mer.pts[i].v;renderViews();draw();
    const p=mer.pts[i].p;vb=clampVB(centerOn(p[0],p[1],zoomWidthFor(i)));apply();
    xnote(`${VIEWS[view]}の図に切り替えました`);cam=false;
  }
  markSel();
  $$(".chip").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.i===i));
  const c=$(`.chip[data-i="${i}"]`);if(c)c.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});
  renderInfo();
  if(cam&&i>=0){const p=mer.pts[i].p;animateTo(centerOn(p[0],p[1],zoomWidthFor(i)));}
}

// ============ 流注の再生：線をたどり、通った経穴を順に光らせる（向きの切り替えも自動） ============
let segLen={},playRaf=0,playing=false;
function measure(){
  segLen={};
  mer.segs.forEach((s,k)=>{
    const path=$(`#seg${k}`,svg);if(!path)return;
    const L=path.getTotalLength(),N=Math.max(200,Math.round(L*2)),samples=[];
    for(let j=0;j<=N;j++){const t=L*j/N,q=path.getPointAtLength(t);samples.push([t,q.x,q.y]);}
    const marks=s.s.filter(x=>!Array.isArray(x)).map(n=>{const p=mer.pts[n-1].p;let b=0,bd=1e9;for(const [t,x,y] of samples){const d=Math.hypot(x-p[0],y-p[1]);if(d<bd){bd=d;b=t;}}return [b,n-1];});
    segLen[k]={L,marks};
  });
}
function startPlay(){
  stopPlay();playing=true;$("#play").textContent="❚❚ 一時停止";
  let k=0;select(-1,{cam:false});
  const runSeg=()=>{
    if(!playing)return;
    if(k>=mer.segs.length){stopPlay();animateTo(fitRect(focusRect()),700);return;}
    const s=mer.segs[k];
    if(s.v!==view){view=s.v;renderViews();draw();xnote(`${VIEWS[view]}の図へ`);}
    const path=$(`#seg${k}`,svg),rn=$("#runner"),info=segLen[k];
    if(!path||!info){k++;runSeg();return;}
    const L=info.L,dur=Math.max(1500,L*11),t0=performance.now();let passed=-1;
    const xs=segPts(s),w0=Math.max(...xs.map(p=>p[0]))-Math.min(...xs.map(p=>p[0])),h0=Math.max(...xs.map(p=>p[1]))-Math.min(...xs.map(p=>p[1]));
    const camW=Math.max(90,Math.min(240,Math.max(w0,h0)*0.55));
    const step=now=>{
      if(!playing)return;
      const f=Math.min(1,(now-t0)/dur),t=f*L,q=path.getPointAtLength(t);
      rn.style.display="";rn.setAttribute("cx",q.x);rn.setAttribute("cy",q.y);
      const tg=clampVB(centerOn(q.x,q.y,camW));
      vb={x:vb.x+(tg.x-vb.x)*.12,y:vb.y+(tg.y-vb.y)*.12,w:vb.w+(tg.w-vb.w)*.12,h:vb.h+(tg.h-vb.h)*.12};apply();
      while(passed+1<info.marks.length&&info.marks[passed+1][0]<=t+0.5){passed++;select(info.marks[passed][1],{cam:false});}
      if(f<1)playRaf=requestAnimationFrame(step);else{k++;runSeg();}
    };
    playRaf=requestAnimationFrame(step);
  };
  runSeg();
}
function stopPlay(){
  if(!playing)return;playing=false;cancelAnimationFrame(playRaf);
  $("#play").textContent="▶ 流注を再生";const rn=$("#runner");if(rn)rn.style.display="none";
}
$("#play").onclick=()=>playing?stopPlay():startPlay();

// ============ 表示の切り替え ============
$$(".tg").forEach(b=>b.onclick=()=>{
  const on=b.getAttribute("aria-pressed")!=="true";b.setAttribute("aria-pressed",on);
  const t=b.dataset.t;
  if(t==="label")svg.classList.toggle("nolabel",!on);
  if(t==="flow")svg.classList.toggle("flowon",on);
  if(t==="in"&&mer.internal){stopPlay();if(view!==mer.internal.v){view=mer.internal.v;renderViews();draw();}
    svg.classList.toggle("showin",on);animateTo(fitRect(on?mer.internal.fit:focusRect()),600);}
});
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight")select(Math.min(mer.pts.length-1,sel+1));
  else if(e.key==="ArrowLeft")select(Math.max(0,sel-1));
  else if(e.key===" "){e.preventDefault();playing?stopPlay():startPlay();}
});

// 画面の大きさが決まってから最初の表示範囲を決める
let inited=false;
new ResizeObserver(()=>{
  if(!viewer.clientWidth||!viewer.clientHeight)return;
  if(!inited){inited=true;vb=fitRect(focusRect());}
  else{const cx=vb.x+vb.w/2,cy=vb.y+vb.h/2;vb.h=vb.w*aspect();vb.x=cx-vb.w/2;vb.y=cy-vb.h/2;}
  apply();
}).observe(viewer);

// 起動（#ST のようにURLで経絡を指定できる）
renderMers();
const start=(location.hash||"").slice(1);
mer=MERS.find(m=>m.id===start)||MERS[0];view=viewsOf(mer)[0];
$$(".mer").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===mer.id));
renderViews();draw();renderChips();renderInfo();
</script>
</body>
</html>
